<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>噴漆闖關 SPRAY RUN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Permanent+Marker&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: one-screen cabinet. HUD on top, tall scrolling table in the middle (camera inside the canvas), hint below.
   Menus (title / city map / cards / results) are full-screen spray-painted overlays. Single dark look on purpose: it's a night wall. */
:root {
  --wall: #18181d;
  --brick-a: #222229;
  --brick-b: #1d1d23;
  --ink: #111114;
  --text: #f5f5f7;
  --muted: #a7a7b3;
  --pink: #ff3ea5;
  --yellow: #ffe14d;
  --cyan: #3ee0ff;
  --lime: #9dff3a;
  --purple: #b25cff;
  --orange: #ff8a1f;
  --font-tag: "Permanent Marker", "Bungee", Impact, sans-serif;
  --font-block: "Bungee", Impact, sans-serif;
  --font-body: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--text); font-family: var(--font-body); font-size: 15px; overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  background-color: var(--wall);
  background-image:
    linear-gradient(var(--brick-b) 2px, transparent 2px),
    linear-gradient(90deg, var(--brick-b) 2px, transparent 2px);
  background-size: 48px 24px, 48px 48px;
}
button { font-family: inherit; }
button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

.app { height: 100%; display: flex; flex-direction: column; align-items: center; padding-inline: 8px; }
.hud {
  width: 100%; max-width: 520px; display: flex; align-items: center; gap: 10px; padding-block: 6px; position: relative; z-index: 2;
}
#pinkyHud { width: 52px; height: 52px; flex: 0 0 52px; }
.hud .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.stage-chip { font-family: var(--font-block); font-size: 13px; color: var(--yellow); letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hearts { font-size: 16px; letter-spacing: 1px; color: var(--pink); text-shadow: 1px 1px 0 var(--ink); white-space: nowrap; }
.hearts .empty { color: #4a4a55; }
.score { font-family: var(--font-block); font-size: 22px; color: var(--text); font-variant-numeric: tabular-nums; text-shadow: 2px 2px 0 var(--ink); white-space: nowrap; }
.icon-btn {
  appearance: none; border: 2.5px solid var(--ink); background: var(--yellow); color: var(--ink); font-weight: 900;
  width: 40px; height: 40px; border-radius: 10px; box-shadow: 3px 3px 0 var(--ink); cursor: pointer; font-size: 16px; flex: 0 0 40px;
}
.bubble {
  position: absolute; left: 58px; top: 58px; max-width: min(300px, 70vw); background: #fff; color: var(--ink);
  border: 3px solid var(--ink); border-radius: 14px; padding: 6px 12px; font-weight: 700; font-size: 14px; line-height: 1.45;
  box-shadow: 3px 3px 0 var(--ink); transform-origin: top left; animation: pop .18s ease-out; z-index: 3; pointer-events: none;
}
.bubble::before { content: ""; position: absolute; left: 10px; top: -11px; border: 8px solid transparent; border-bottom-color: var(--ink); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.stagewrap { position: relative; flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; perspective: 1000px; }
canvas#game {
  display: block; touch-action: none; border-radius: 16px; border: 4px solid var(--ink);
  box-shadow: 0 0 0 3px var(--pink), 8px 10px 0 3px var(--ink); transform-origin: 50% 70%; will-change: transform;
}
.hint { font-size: 12px; color: var(--muted); padding-block: 6px; text-align: center; min-height: 18px; }
.assist-line { font-size: 12px; color: var(--lime); margin: -4px 0 10px; }

/* ---------- 全螢幕畫面 ---------- */
.screen {
  position: fixed; inset: 0; z-index: 10; overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
  background: rgba(12, 12, 16, 0.86); backdrop-filter: blur(3px);
}
.screen[hidden] { display: none !important; }
.inner { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.tag-title {
  font-family: var(--font-tag); font-size: clamp(44px, 14vw, 72px); line-height: .95; margin: 8px 0 0; text-align: center;
  color: var(--pink); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; transform: rotate(-4deg);
  text-shadow: 5px 5px 0 var(--ink), 0 0 24px rgba(255, 62, 165, .45);
}
.tag-title .y { color: var(--yellow); } .tag-title .c { color: var(--cyan); }
.sub { text-align: center; color: var(--muted); margin: 0; }
.h2 { font-family: var(--font-block); font-size: 22px; margin: 0; color: var(--yellow); text-shadow: 2px 2px 0 var(--ink); }
.big-btn {
  appearance: none; border: 3px solid var(--ink); border-radius: 14px; padding: 14px 18px; font-size: 18px; font-weight: 900;
  background: var(--pink); color: #fff; box-shadow: 5px 5px 0 var(--ink); cursor: pointer; text-shadow: 2px 2px 0 var(--ink);
  transform: rotate(-1deg); transition: transform .08s;
}
.big-btn:active { transform: translate(3px, 3px) rotate(-1deg); box-shadow: 2px 2px 0 var(--ink); }
.big-btn.alt { background: var(--cyan); color: var(--ink); text-shadow: none; transform: rotate(1deg); }
.big-btn.ghost { background: #2a2a33; color: var(--text); text-shadow: none; transform: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
#titlePinky { width: 180px; height: 180px; align-self: center; }

/* 城市地圖 */
.progress { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.progress b { font-family: var(--font-block); color: var(--lime); font-variant-numeric: tabular-nums; }
.district {
  border: 3px solid var(--ink); border-radius: 18px; padding: 14px; position: relative; overflow: hidden;
  box-shadow: 6px 6px 0 var(--ink); background: #26262e;
}
.district .bg { position: absolute; inset: 0; opacity: .32; pointer-events: none; }
.district > *:not(.bg) { position: relative; }
.district .act { font-family: var(--font-block); font-size: 12px; color: var(--ink); background: var(--yellow); display: inline-block; padding: 1px 8px; border-radius: 6px; border: 2px solid var(--ink); }
.district h3 { font-family: var(--font-body); font-weight: 900; font-size: 24px; margin: 6px 0 2px; text-shadow: 2px 2px 0 var(--ink); }
.district h3 small { font-family: var(--font-block); font-size: 12px; color: var(--muted); margin-left: 6px; font-weight: 400; }
.district .story { color: #dcdce4; font-size: 13px; margin: 0 0 10px; line-height: 1.6; }
.nodes { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-bottom: 12px; }
.node { aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--ink); background: #3a3a44; display: grid; place-items: center; font-size: 10px; font-weight: 900; color: var(--ink); }
.node.done { background: var(--yellow); }
.node.next { background: #fff; box-shadow: 0 0 0 3px var(--pink); }
.node.boss { border-radius: 6px; }
.node .s { font-size: 8px; letter-spacing: -1px; }
/* v3.8 關卡按鈕：來回的街道路線（1→5、10←6），每顆 48 px（手機好點） */
.route { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: 48px 48px; row-gap: 14px; margin: 6px 0 10px; }
.route-art { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
/* 2.6 一條街：5 區放在同一個地圖框；路從上一區第 10 關沿左邊往下接到下一區第 1 關。
   位置算法：卡片內距 14px、路線高 110px、下方留 10px；第 1 欄中心＝內容寬的 10% */
.city { border: 3px solid var(--ink); border-radius: 18px; overflow: hidden; box-shadow: 6px 6px 0 var(--ink); display: flex; flex-direction: column; }
.city .district { border: 0; border-radius: 0; box-shadow: none; padding-bottom: 14px; }
.city .district + .district { box-shadow: inset 0 2px 0 rgba(255,255,255,.12); }
.city .district > .route { margin-bottom: 10px; }
.city .district > :not(.bg):not(.route):not(.lane) { margin-left: calc(10% + 28px); }
.district > .lane { position: absolute; left: calc(14px + (100% - 28px) * .1 - 18px); width: 36px; background: var(--curb); opacity: .9; pointer-events: none; }
.lane::before { content: ""; position: absolute; inset: 0 3px; background: #2b2b34; }
.lane::after { content: ""; position: absolute; left: calc(50% - 1px); top: 0; bottom: 0; width: 2px; opacity: .8; background: repeating-linear-gradient(to bottom, var(--lane) 0 9px, transparent 9px 19px); }
.district > .lane-in { top: 0; bottom: 110px; }
.district > .lane-out { top: calc(100% - 48px); bottom: 0; }
.stop { appearance: none; position: relative; justify-self: center; width: 48px; height: 48px; padding: 0; border-radius: 50%; border: 3px solid var(--ink); background: #3a3a44; color: var(--text);
  font-family: var(--font-block); font-size: 17px; line-height: 1; display: grid; place-items: center; cursor: pointer; box-shadow: 3px 3px 0 var(--ink); }
.stop.done { color: var(--ink); }
.stop.next { background: #fff; color: var(--ink); box-shadow: 0 0 0 4px var(--pink), 3px 3px 0 var(--ink); }
.stop.boss { border-radius: 12px; }
.stop:disabled { cursor: default; opacity: .55; box-shadow: none; }
.stop:not(:disabled):active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.stop .tag { position: absolute; right: -7px; top: -7px; min-width: 21px; height: 21px; padding: 0 3px; border-radius: 11px; border: 2px solid var(--ink); background: var(--yellow); color: var(--ink);
  font-family: var(--font-body); font-size: 11px; font-weight: 900; display: grid; place-items: center; }
.stop.next .tag { background: var(--pink); color: #fff; }
.stop:disabled .tag { background: #2a2a33; color: var(--muted); font-size: 10px; }
.mc.m3, .stop.m3 { background: #ffd23f; } .mc.m2, .stop.m2 { background: #dfe6ee; } .mc.m1, .stop.m1 { background: #e0915a; }
.nextname { margin: 0 0 8px; font-weight: 900; font-size: 15px; text-shadow: 1px 1px 0 var(--ink); }
.big-btn.small { padding: 9px 14px; font-size: 15px; box-shadow: 3px 3px 0 var(--ink); }
.district.locked { filter: grayscale(1) brightness(.6); }
.district.locked .lockmsg { color: var(--muted); font-size: 13px; }

/* 強化卡 */
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.card {
  appearance: none; border: 3px solid var(--ink); border-radius: 16px; background: #fff; color: var(--ink); padding: 14px 8px 12px;
  box-shadow: 5px 5px 0 var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
  min-width: 0; transition: transform .1s;
}
.card:nth-child(1) { transform: rotate(-2deg); } .card:nth-child(3) { transform: rotate(2deg); }
.card:hover { transform: translateY(-4px) rotate(0); }
.card .ico { font-size: 34px; width: 58px; height: 58px; display: grid; place-items: center; border-radius: 50%; border: 3px solid var(--ink); }
.card b { font-size: 16px; font-weight: 900; }
.card span { font-size: 12px; line-height: 1.45; color: #333; }
.card i { font-style: normal; font-family: var(--font-block); font-size: 11px; color: #777; }
.build { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 2px solid var(--ink); background: #2a2a33; border-radius: 999px; padding: 2px 10px; font-size: 12px; }
@media (max-width: 400px) {
  .cards { grid-template-columns: 1fr; }
  .card { display: grid; grid-template-columns: 58px 1fr auto; grid-template-areas: "ico name lv" "ico desc lv"; column-gap: 12px; row-gap: 2px; text-align: left; align-items: center; padding: 12px; }
  .card:nth-child(n) { transform: none; }
  .card .ico { grid-area: ico; } .card b { grid-area: name; white-space: nowrap; } .card span { grid-area: desc; } .card i { grid-area: lv; white-space: nowrap; }
}

.card.picked { box-shadow: 0 0 0 4px var(--pink), 5px 5px 0 var(--ink); }
/* 結果：獎牌（依愛心）＋抽到的強化 */
.medal { display: flex; flex-direction: column; align-items: center; gap: 2px; animation: medalIn .6s cubic-bezier(.2,1.6,.4,1) both; }
.medal .disc { position: relative; width: 104px; height: 104px; border-radius: 50%; border: 5px solid var(--ink); display: grid; place-items: center; font-size: 46px; font-weight: 900; color: var(--ink); box-shadow: 6px 6px 0 var(--ink), inset -8px -10px 0 rgba(0,0,0,.18), inset 8px 8px 0 rgba(255,255,255,.45); margin-top: 30px; }
.medal .disc::before { content: ""; position: absolute; top: -38px; left: 50%; width: 46px; height: 40px; transform: translateX(-50%); background: linear-gradient(90deg, var(--pink) 0 33%, #fff 33% 66%, var(--cyan) 66%); border: 4px solid var(--ink); border-bottom: 0; z-index: -1; }
.medal-3 .disc { background: radial-gradient(circle at 35% 30%, #fff6b0, #ffd23f 45%, #e09b00); }
.medal-2 .disc { background: radial-gradient(circle at 35% 30%, #ffffff, #dfe6ee 45%, #98a4b1); }
.medal-1 .disc { background: radial-gradient(circle at 35% 30%, #ffd9b8, #e0915a 45%, #9c5524); }
.mc { font-style: normal; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ink); font-size: 10px; font-weight: 900; color: var(--ink); margin: 0 1px 0 4px; vertical-align: -3px; }
.mc.m3, .node.m3 { background: #ffd23f; } .mc.m2, .node.m2 { background: #dfe6ee; } .mc.m1, .node.m1 { background: #e0915a; }
.medal b { font-family: var(--font-block); font-size: 22px; letter-spacing: 2px; -webkit-text-stroke: 1px var(--ink); }
.medal-3 b { color: #ffd23f; } .medal-2 b { color: #dfe6ee; } .medal-1 b { color: #e0915a; }
@keyframes medalIn { from { transform: scale(2.4) rotate(-25deg); opacity: 0; } to { transform: none; opacity: 1; } }
.reward { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: center; background: #fff; color: var(--ink); border: 3px solid var(--ink); border-radius: 14px; padding: 10px; box-shadow: 5px 5px 0 var(--ink); animation: medalIn .5s .25s both; }
.reward .ico { width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--ink); display: grid; place-items: center; font-size: 26px; }
.reward b { display: block; } .reward span { font-size: 12px; color: #444; }
button.node { appearance: none; padding: 0; cursor: pointer; font-family: inherit; }
button.node:disabled { cursor: default; opacity: .7; }
button.node .s { font-size: 13px; letter-spacing: 0; }
button.ach { appearance: none; color: inherit; font: inherit; }
/* 結果 */
.stars { font-size: 48px; text-align: center; letter-spacing: 6px; color: var(--yellow); -webkit-text-stroke: 2px var(--ink); text-shadow: 3px 3px 0 var(--ink); }
.stars .off { color: #3a3a44; }
.stat-grid { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; background: #22222a; border: 3px solid var(--ink); border-radius: 14px; padding: 12px 16px; }
.stat-grid dt { color: var(--muted); } .stat-grid dd { margin: 0; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }

/* 成就 */
.ach { display: grid; grid-template-columns: 48px 1fr; gap: 10px; align-items: center; background: #22222a; border: 3px solid var(--ink); border-radius: 14px; padding: 10px; }
.ach .badge { width: 48px; height: 48px; border-radius: 50%; border: 3px solid var(--ink); display: grid; place-items: center; font-size: 22px; background: #3a3a44; }
.ach.got .badge { background: var(--lime); }
.ach b { display: block; } .ach span { color: var(--muted); font-size: 13px; }
.ach:not(.got) b { color: var(--muted); }

/* 對話 */
.dialog {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 12px 12px calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex; justify-content: center; pointer-events: auto;
}
.dialog[hidden] { display: none; }
.dialog .box {
  width: 100%; max-width: 560px; background: #fff; color: var(--ink); border: 4px solid var(--ink); border-radius: 18px;
  box-shadow: 6px 6px 0 var(--ink); padding: 12px 14px 12px 12px; display: grid; grid-template-columns: 96px 1fr; gap: 12px; cursor: pointer;
}
.dialog canvas { width: 96px; height: 96px; }
.dialog .name { font-weight: 900; font-size: 15px; display: inline-block; padding: 0 10px; border: 2.5px solid var(--ink); border-radius: 8px; margin-bottom: 6px; }
.dialog .text { font-size: 17px; line-height: 1.6; min-height: 54px; font-weight: 500; }
.dialog .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; color: #777; font-size: 12px; }
.dialog .skip { appearance: none; border: 2px solid var(--ink); background: var(--yellow); border-radius: 8px; padding: 3px 10px; font-weight: 900; cursor: pointer; }
.dialog.narrator .box { background: #111114; color: #fff; grid-template-columns: 1fr; }
.dialog.narrator canvas { display: none; }
.dialog.narrator .text { font-style: italic; color: #f0f0f0; }

/* 漫畫劇情 */
.comic { position: fixed; inset: 0; z-index: 25; background: #18181d; display: flex; align-items: center; justify-content: center; touch-action: none; cursor: pointer; }
.comic[hidden] { display: none; }
.comic canvas { display: block; }
.comic-skip { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: 12px; appearance: none; border: 2.5px solid var(--ink); background: var(--yellow); color: var(--ink); font-weight: 900; border-radius: 10px; padding: 6px 12px; box-shadow: 3px 3px 0 var(--ink); cursor: pointer; }

/* 成就通知 */
.toasts { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 0; right: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast { background: var(--lime); color: var(--ink); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--ink); padding: 8px 14px; font-weight: 900; animation: pop .2s ease-out; max-width: 90vw; }
.toast small { display: block; font-weight: 500; }
.credits { text-align: center; display: grid; gap: 14px; }
.credits dt { color: var(--muted); font-size: 13px; } .credits dd { margin: 0; font-weight: 900; font-size: 18px; }
@media (prefers-reduced-motion: reduce) { .bubble, .toast { animation: none; } .big-btn { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="hud" id="hud">
    <canvas id="pinkyHud" width="104" height="104" aria-label="噴噴"></canvas>
    <div class="mid">
      <div class="stage-chip" id="stageChip">SPRAY RUN</div>
      <div class="hearts" id="hearts" aria-label="愛心"></div>
    </div>
    <div class="score" id="score">0</div>
    <button class="icon-btn" id="pauseBtn" aria-label="暫停">❚❚</button>
    <div class="bubble" id="bubble" hidden></div>
  </header>
  <div class="stagewrap" id="stagewrap">
    <canvas id="game" width="400" height="740" aria-label="噴漆彈珠台"></canvas>
  </div>
  <div class="hint" id="hint"></div>
</div>

<section class="screen" id="screen" hidden></section>
<div class="comic" id="comicLayer" hidden>
  <canvas id="comicCanvas" width="400" height="740" aria-label="漫畫劇情"></canvas>
  <button class="comic-skip" id="comicSkip">跳過劇情 ▶▶</button>
</div>
<div class="toasts" id="toasts"></div>

<script src="js/data.js?v=3.10.0"></script>
<script src="js/levels.js?v=3.10.0"></script>
<script src="js/levelcheck.js?v=3.10.0"></script>
<script src="js/tuning.js?v=3.10.0"></script>
<script src="js/tune.js?v=3.10.0"></script>
<script src="js/physics.js?v=3.10.0"></script>
<script src="js/rules.js?v=3.10.0"></script>
<script src="js/art.js?v=3.10.0"></script>
<script src="js/comic.js?v=3.10.0"></script>
<script src="js/audio.js?v=3.10.0"></script>
<script src="js/tests.js?v=3.10.0"></script>
<script src="js/game.js?v=3.10.0"></script>
</body>
</html>
