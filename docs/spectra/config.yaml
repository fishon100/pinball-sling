schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

context: |
  Game: 噴漆闖關 SPRAY RUN — pinball × brick breaker web game (test project for the team's AI dev-flow framework).
  Tech: plain JS canvas in web/street/js (data/tuning/physics/rules/art/comic/audio/game/tests.js); Godot 4.7 v2 table in project root.
  Tests: web/street/test.html (browser, 22 tests) + godot tests/run_tests.gd; difficulty MUST be measured with human-like bots (SR.Tests.HUMAN), never machine reaction speed.
  Every JS change bumps ?v= in web/street/index.html and test.html. Deploy with tools/deploy.ps1.
  Readers are game planners new to programming: write proposal/design/tasks in plain Traditional Chinese.
  Hard rules from the planner: never add a drain-blocking center post; 「中柱」 means pop bumper; story is a fairy tale, never slapstick; never show 起承轉合 in UI.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
rules:
  proposal:
    - 第一行固定寫「> 中文標題：<一句話，15 字內>」（工作台、GitHub Issue、Notion 都用這個標題）
    - 「Why」用企劃看得懂的話寫：玩家遇到什麼問題、這次要解決什麼
    - 最後一節固定是「## 需要企劃確認的事」：數值、文字、取捨條列出來（沒有就寫「無」）
    - 有拿掉或改變玩家已經習慣的東西時，標 **BREAKING** 並說明影響
  specs:
    - 每條規則下面至少一個「情境：當…，則…」，之後會一對一變成自動測試
    - 規則後面附一行中文說明（> 中文：…）
  tasks:
    - 第一組固定是「## 0. 企劃確認」，只有一項：「- [ ] 0.1 企劃確認：讀過 proposal 的為什麼、改什麼、需要企劃確認的事，同意開始實作」（企劃可在工作台／GitHub Issue、Notion、Spectra 桌面版同意，或在對話中說「同意」）。AI 不可以自己決定同意：只有企劃在對話中明確說「同意」或 Notion 卡片是「同意」時才由 AI 勾，並在後面註明「（企劃於對話中／Notion 同意，日期）」；GitHub Issue 的勾選由 workbench Action 自動寫回
    - 實作的第一個任務一定是「先寫會失敗的測試」（TDD）
    - 最後兩個任務固定是「跑全部測試」與「部署並通知」
